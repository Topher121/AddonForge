[package]
name = "addonforge"
version = "0.2.0"
description = "Lightweight, telemetry-free addon manager for WoW: Forever"
authors = ["Pocket Forge Studios"]
edition = "2021"

[lib]
name = "addonforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "io-util"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "tga", "jpeg", "gif"] }
image-blp = "1"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
