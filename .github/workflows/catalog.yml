name: Validate catalogue

on:
  pull_request:
    paths:
      - "catalog/**"
      - "scripts/validate-catalog.js"
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "scripts/validate-catalog.js"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate catalog/forever.json
        run: node scripts/validate-catalog.js
